<body>
<div id="asset-store">

  <img id="img-splash" src="assets/splash.jpg" alt="" hidden>
  <img id="img-banner" src="assets/banner.jpg" alt="" hidden>
  <audio id="snd-credits" src="assets/credits_addup.wav"></audio>

  <audio id="snd-ring" src="assets/ring1.mp3"></audio>
  <audio id="snd-welcome" src="assets/splash_welcome.wav"></audio>
</div><div id="splash">
  <div id="splash-bg"></div>
  <div id="splash-foot">
    <div id="splash-title">STRAYPUPS BIG MUNNY</div>
    <div id="splash-ver">v5.27</div>
    <div id="splash-bar"><div id="splash-bar-fill"></div></div>
    <div id="splash-tap">TAP TO PLAY</div>
  </div>

<div id="app">

  <!-- BINGO SECTION: pattern name + card + ball strip -->

    <div id="bingo-pattern-name">&nbsp;</div>
    <div id="bingo-card-area">
      <div id="bingo-card-wrap">
        <div id="bingo-col-hdrs">
          <div class="bcol-hdr">B</div><div class="bcol-hdr">I</div>
          <div class="bcol-hdr">N</div><div class="bcol-hdr">G</div><div class="bcol-hdr">O</div>
        </div>
        <div id="bingo-grid"></div>
      </div>
      <!-- Ball strip BELOW card -->
      <div id="ball-strip-area">
        <div id="ball-strip-grid"></div>
      </div>
    </div>
  </div>

  <!-- REEL SECTION â€” bigger -->
  <div id="reel-section">
    <div id="reel-frame">
      <div id="red-ov"></div>
      <div id="payline-mark"></div>
      <div id="pl-left">PAYLINE</div>
      <div id="pl-right">PAYLINE</div>
      <div id="rs-badge">RED SPIN</div>
      <div class="reel" id="r0"><div class="reel-window" id="rw0"><div class="reel-strip" id="rs0"></div></div></div>
      <div class="reel" id="r1"><div class="reel-window" id="rw1"><div class="reel-strip" id="rs1"></div></div></div>
      <div class="reel" id="r2"><div class="reel-window" id="rw2"><div class="reel-strip" id="rs2"></div></div></div>

  </div>

  <div id="info-bar">

    <div class="iitem"><div class="ilbl">BET</div><div class="ival" id="betval">$1.00</div></div>
    <div class="iitem"><div class="ilbl">DENOM</div><div class="ival">$1</div></div>
  </div>
  <div id="controls">

      <button class="cbtn" id="cred-btn">CREDITS: <span id="cdisp">1</span></button>
      <button class="cbtn" id="spin-btn">SPIN</button>
      <button class="cbtn" id="max-btn">BET MAX<br><span style="font-size:10px">3 CREDITS</span></button>
    </div>
    <div id="ctrl-btm">
      <button class="abtn aco" id="co-btn">$$ CASH OUT</button>
      <button class="abtn" id="help-btn" style="background:linear-gradient(135deg,#0d001a,#1a0035);border:1.5px solid var(--gold-dk);color:var(--gold-lt)">PAYS</button>
      <button class="abtn aic" id="ic-btn">+ INSERT CASH</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="jp-ov">
  <div id="jp-burst"></div><div id="jp-big">JACKPOT!</div>
  <div id="jp-sub">CONGRATULATIONS!</div><div id="jp-amt"></div>
  <div id="jp-hint">TAP TO CONTINUE</div>
</div>

  <div class="ic-pre-row">
    <button class="icpre" data-a="20">$20</button><button class="icpre" data-a="50">$50</button>
    <button class="icpre" data-a="100">$100</button><button class="icpre" data-a="500">$500</button>
  </div>

    <input class="ic-inp" type="number" id="ic-inp" value="100" min="1" max="9999">
    <button class="icbtn ok" id="ic-ok">ADD</button>

  </div>
</div>
<div id="help">
  <div id="help-hdr"><div id="help-ttl">PAY TABLE</div><button id="help-close">CLOSE</button></div>
  <div id="help-body"></div>
</div>

<script src="js/config.js?v=5.27"></script>
<script src="js/game.js?v=5.27"></script>
<script src="js/operator.js?v=5.27"></script>

<!-- PWA Install Banner -->
<div id="pwa-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:99999;
  background:linear-gradient(135deg,#1a0035,#08000f);
  border-top:2px solid #d4af37;
  padding:14px 16px 20px;
  box-shadow:0 -4px 20px rgba(212,175,55,.3);
  font-family:Impact,sans-serif;
  text-align:center;">
  <div style="color:#f5d878;font-size:18px;letter-spacing:2px;margin-bottom:6px;">
    📲 INSTALL THIS GAME ON YOUR PHONE
  </div>
  <div id="pwa-safari-msg" style="display:none;color:rgba(255,255,255,.7);font-size:11px;letter-spacing:1px;margin-bottom:10px;">
    Tap <strong style="color:#f5d878">Share</strong> then <strong style="color:#f5d878">Add to Home Screen</strong>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;">
    <button id="pwa-install-btn" style="display:none;background:linear-gradient(135deg,#d4af37,#8b6914);
      color:#08000f;border:none;border-radius:8px;padding:10px 24px;
      font-family:Impact,sans-serif;font-size:14px;letter-spacing:2px;cursor:pointer;">
      INSTALL NOW
    </button>
    <button id="pwa-dismiss-btn" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);
      border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px 20px;
      font-family:Impact,sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;">
      NOT NOW
    </button>
  </div>
</div>

<script>
/* ── PWA SERVICE WORKER + INSTALL PROMPT ── */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

var _pwaPrompt = null;
var _pwaShown = false;

// Capture native install prompt if available (Chrome/Android)
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  _pwaPrompt = e;
});

function showPWABanner(){
  if(_pwaShown) return;
  if(window.matchMedia('(display-mode: standalone)').matches) return;
  if(window.navigator.standalone === true) return;
  _pwaShown = true;

  var banner   = document.getElementById('pwa-banner');
  var installBtn = document.getElementById('pwa-install-btn');
  var safariMsg  = document.getElementById('pwa-safari-msg');
  var dismissBtn = document.getElementById('pwa-dismiss-btn');

  var isIOS    = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var isSafari = /safari/i.test(navigator.userAgent) && !/chrome|crios|fxios/i.test(navigator.userAgent);

  if(isIOS && isSafari){
    // Safari iOS — show tap Share instructions + button that highlights share
    safariMsg.style.display = 'block';
    installBtn.style.display = 'inline-block';
    installBtn.textContent = 'TAP SHARE → ADD TO HOME SCREEN';
    installBtn.addEventListener('click', function(){
      // Can't trigger Safari share programmatically — just highlight instruction
      safariMsg.style.color = '#f5d878';
      safariMsg.style.fontWeight = 'bold';
    });
  } else {
    // Chrome, Samsung Browser, Edge, Firefox — always show INSTALL NOW button
    installBtn.style.display = 'inline-block';
    installBtn.textContent = 'INSTALL NOW';
    installBtn.addEventListener('click', function(){
      if(_pwaPrompt){
        // Native prompt available — use it
        _pwaPrompt.prompt();
        _pwaPrompt.userChoice.then(function(result){
          if(result.outcome === 'accepted') banner.style.display = 'none';
        });
      } else {
        // No native prompt yet — guide user to browser menu
        safariMsg.style.display = 'block';
        safariMsg.innerHTML = 'Tap your browser’s <strong style="color:#f5d878">menu (⋮ or ☰)</strong> then tap <strong style="color:#f5d878">Add to Home Screen</strong>';
        installBtn.textContent = 'SEE INSTRUCTIONS ABOVE';
        installBtn.style.background = 'rgba(212,175,55,.2)';
      }
    });
  }

  banner.style.display = 'block';
  var autoHide = setTimeout(function(){ banner.style.display='none'; }, 15000);
  dismissBtn.addEventListener('click', function(){
    clearTimeout(autoHide);
    banner.style.display='none';
  });
}

(function(){
  var check = setInterval(function(){
    var sp = document.getElementById('splash');
    if(sp && (sp.style.display==='none' || sp.classList.contains('fade'))){
      clearInterval(check);
      setTimeout(showPWABanner, 800);
    }
  }, 500);
  setTimeout(function(){ clearInterval(check); showPWABanner(); }, 6000);
}());
</script>
</body>
</html>
